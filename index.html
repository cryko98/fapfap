<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fap Guy ($FAP)</title>
<meta name="description" content="Fap Guy ($FAP) — Solana memecoin">
<meta property="og:title" content="Fap Guy ($FAP)">
<meta property="og:image" content="assets/banner.gif">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/gif" href="assets/favicon.gif">
<link rel="alternate icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root { --ink: #000; --paper: #fff; --pink: #ff3fa4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: hidden; }
  body { font-family: Impact, "Arial Black", system-ui, sans-serif; min-height: 100vh; }
  img { -webkit-user-drag: none; user-select: none; }

  header {
    position: fixed; inset: 0 0 auto 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: rgba(255,255,255,.9);
    border-bottom: 4px solid var(--ink); backdrop-filter: blur(4px);
  }
  .logo { width: 64px; height: 64px; border: 4px solid var(--ink); border-radius: 50%; background: #fff; display: block; }
  .right { display: flex; align-items: center; gap: 12px; }
  .x {
    width: 52px; height: 52px; display: grid; place-items: center;
    background: var(--ink); border: 4px solid var(--ink); border-radius: 12px;
    transition: transform .15s;
  }
  .x svg { width: 26px; height: 26px; fill: #fff; }
  .x:hover { transform: rotate(-8deg) scale(1.08); }
  .kym { color: #fff; text-decoration: none; font-size: 17px; letter-spacing: .5px; }
  .ca {
    border: 4px solid var(--ink); border-radius: 12px; background: #fff;
    padding: 10px 16px; font-size: 22px; letter-spacing: .5px; white-space: nowrap;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .ca { font-family: inherit; color: var(--ink); cursor: pointer; min-width: 0; }
  .ca:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  .ca b { color: var(--pink); -webkit-text-stroke: 1px var(--ink); }
  .ca .short { display: none; }
  @media (max-width: 1000px) {
    .ca .full { display: none; }
    .ca .short { display: inline; }
  }

  main { position: relative; z-index: 1; padding-top: 92px; }
  .hero { position: relative; z-index: 5; display: flex; justify-content: center; padding: 24px 16px; }
  .hero img {
    width: 100%; max-width: 1500px; height: auto; display: block;
    border: 5px solid var(--ink); border-radius: 16px; background: #fff;
    box-shadow: 10px 10px 0 var(--ink);
  }
  .big { position: relative; z-index: 5; display: flex; justify-content: center; padding: 40px 16px; }
  .big img { width: min(520px, 65vw); height: auto; animation: bounce .5s steps(2) infinite; }

  #chaos { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  #chaos img, .burst { position: absolute; will-change: transform; }
  .wall { height: 220vh; }

  @keyframes jitter {
    0%   { transform: translate(0,0) rotate(var(--r)) scaleX(var(--f)); }
    25%  { transform: translate(3px,-4px) rotate(calc(var(--r) + 4deg)) scaleX(var(--f)); }
    50%  { transform: translate(-3px,2px) rotate(calc(var(--r) - 3deg)) scaleX(var(--f)); }
    75%  { transform: translate(2px,4px) rotate(calc(var(--r) + 2deg)) scaleX(var(--f)); }
    100% { transform: translate(0,0) rotate(var(--r)) scaleX(var(--f)); }
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(var(--r)) scaleX(var(--f)); }
    50%     { transform: translateY(-12px) rotate(calc(var(--r) * -1)) scaleX(var(--f)); }
  }
  @keyframes spin { to { transform: rotate(360deg) scaleX(var(--f)); } }
  @keyframes bounce { 50% { transform: translateY(-14px) scale(1.03); } }
  @keyframes pop {
    0% { transform: translate(-50%,-50%) scale(.2) rotate(var(--r)); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(calc(var(--r) * 3)); opacity: 0; }
  }
  .burst { z-index: 200; pointer-events: none; animation: pop .9s ease-out forwards; }

  @media (max-width: 560px) {
    .logo { width: 48px; height: 48px; }
    .x { width: 44px; height: 44px; }
    .kym { font-size: 14px; }
    .right { gap: 8px; }
    .ca { font-size: 16px; padding: 8px 10px; box-shadow: 3px 3px 0 var(--ink); }
    main { padding-top: 76px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #chaos img, .big img { animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <a href="#" aria-label="Fap Guy"><img class="logo" src="assets/logo.gif" alt="Fap Guy"></a>
  <div class="right">
    <a class="x kym" href="https://knowyourmeme.com/memes/fap-guy" target="_blank" rel="noopener" aria-label="Know Your Meme">KYM</a>
    <a class="x" href="https://x.com/i/communities/1981147062713434180" target="_blank" rel="noopener" aria-label="X community">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
    <button class="ca" type="button" title="Copy CA" data-ca="FXmXWbWDZjaTkYyKABoGrdTLTYULZ4Vf3dUuPHifpump">CA: <b><span class="full">FXmXWbWDZjaTkYyKABoGrdTLTYULZ4Vf3dUuPHifpump</span><span class="short">FXmX…pump</span></b></button>
  </div>
</header>

<main>
  <div id="chaos" aria-hidden="true"></div>
  <section class="hero"><img src="assets/banner.gif" alt="" width="1500" height="500"></section>
  <section class="big"><img src="assets/char.webp" alt=""></section>
  <div class="wall"></div>
</main>

<script>
(() => {
  const chaos = document.getElementById('chaos');
  const FAPS = ['assets/fap0.png', 'assets/fap1.png', 'assets/fap2.png'];
  const CHAR = 'assets/char.webp';
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);
  const ANIMS = ['jitter', 'jitter', 'floaty', 'spin'];

  function make(src, w, x, y, z, flip) {
    const img = new Image();
    img.src = src; img.alt = ''; img.decoding = 'async';
    const anim = pick(ANIMS);
    img.style.cssText =
      `left:${x}px;top:${y}px;width:${w}px;z-index:${z};` +
      `--r:${rand(-30, 30).toFixed(1)}deg;--f:${flip && Math.random() < .5 ? -1 : 1};` +
      `animation:${anim} ${anim === 'spin' ? rand(3, 9) : rand(.3, 1.6)}s ${anim === 'jitter' ? 'steps(4)' : 'ease-in-out'} ${rand(-2, 0)}s infinite;`;
    chaos.appendChild(img);
  }

  // height / width of the assets
  const CHAR_RATIO = 246 / 195, FAP_RATIO = .5;

  function fill() {
    chaos.innerHTML = '';
    const W = document.documentElement.clientWidth;
    const main = document.querySelector('main');
    const H = main.scrollHeight;
    const scale = Math.min(1, W / 1200) * .6 + .4;
    const area = W * H;
    const top = main.getBoundingClientRect().top + scrollY;

    // areas to keep clear: the banner and the big character
    const blocks = [...document.querySelectorAll('.hero img, .big img')].map(el => {
      const r = el.getBoundingClientRect();
      return { x: r.left, y: r.top + scrollY - top, w: r.width, h: r.height };
    });

    // every item is a circle wide enough for rotation/spin and jitter, so nothing ever touches
    const placed = [];
    const GAP = 8;
    function place(w, h) {
      const rad = Math.hypot(w, h) / 2 + GAP;
      for (let tries = 0; tries < 250; tries++) {
        const cx = rand(rad * .6, W - rad * .6), cy = rand(rad, H - rad);
        if (placed.some(p => Math.hypot(p.cx - cx, p.cy - cy) < p.rad + rad)) continue;
        if (blocks.some(b => cx + rad > b.x && cx - rad < b.x + b.w && cy + rad > b.y && cy - rad < b.y + b.h)) continue;
        placed.push({ cx, cy, rad });
        return { x: cx - w / 2, y: cy - h / 2 };
      }
      return null;
    }

    // ask for far more than fits; whatever can't be placed without overlap is skipped
    const nChar = Math.round(area / 35000);
    const nFap = Math.round(area / 9000);
    // largest first so the big ones get room
    const chars = Array.from({ length: nChar }, () => rand(70, 240) * scale).sort((a, b) => b - a);
    for (const w of chars) {
      const p = place(w, w * CHAR_RATIO);
      if (p) make(CHAR, w, p.x, p.y, 2, true);
    }
    const faps = Array.from({ length: nFap }, () => rand(40, 150) * scale).sort((a, b) => b - a);
    for (const w of faps) {
      const p = place(w, w * FAP_RATIO);
      if (p) make(pick(FAPS), w, p.x, p.y, 2);
    }
  }

  // click / tap anywhere: FAP explosion
  addEventListener('pointerdown', e => {
    if (e.target.closest('header')) return;
    for (let i = 0; i < 10; i++) {
      const el = new Image();
      const isChar = Math.random() < .3;
      el.src = isChar ? CHAR : pick(FAPS);
      el.className = 'burst';
      const w = isChar ? rand(60, 120) : rand(50, 110);
      const a = rand(0, Math.PI * 2), d = rand(80, 260);
      el.style.cssText = `left:${e.pageX}px;top:${e.pageY}px;width:${w}px;` +
        `--r:${rand(-40, 40)}deg;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  });

  // click the CA box to copy the address
  const ca = document.querySelector('.ca');
  ca.addEventListener('click', () => {
    navigator.clipboard?.writeText(ca.dataset.ca).then(() => {
      const b = ca.querySelector('b'), old = b.innerHTML;
      b.textContent = 'copied!';
      setTimeout(() => { b.innerHTML = old; }, 1200);
    });
  });

  let t;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(fill, 250); });
  addEventListener('load', fill);
  fill();
})();
</script>
</body>
</html>
